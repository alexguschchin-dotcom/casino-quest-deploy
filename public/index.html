<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>КОНТРАКТ: СБОЙ СИСТЕМЫ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Inter', 'Segoe UI', monospace;
            background: radial-gradient(circle at 20% 30%, #0a0f1a, #010101);
            color: #0f0;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.2s;
        }
        body.glitch-bg {
            animation: bgPulseRed 0.15s infinite alternate;
        }
        @keyframes bgPulseRed {
            0% { background: radial-gradient(circle, #2a0a0a 0%, #050000 100%); }
            100% { background: radial-gradient(circle, #5a0f0f 0%, #150000 100%); }
        }
        .glitch-text {
            animation: textGlitch 0.15s infinite;
        }
        @keyframes textGlitch {
            0% { transform: skew(0deg); text-shadow: 2px 0 red; opacity: 1; }
            50% { transform: skew(2deg); text-shadow: -2px 0 blue; opacity: 0.9; }
            100% { transform: skew(0deg); text-shadow: none; }
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.55;
        }
        .container {
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        /* Стартовый экран */
        .setup-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .setup-card {
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            border: 2px solid #0f0;
            border-radius: 48px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .setup-card h1 {
            font-size: 2rem;
            margin-bottom: 20px;
        }
        .balance-input {
            background: #111;
            border: 2px solid #0f0;
            padding: 14px 20px;
            border-radius: 60px;
            color: #0f0;
            font-size: 1.4rem;
            width: 100%;
            text-align: center;
            margin: 20px 0;
        }
        .btn {
            background: #0f0;
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            color: black;
            margin: 5px;
        }
        .btn:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 0 15px #0f0;
        }
        .btn:disabled {
            background: #222 !important;
            border-color: #444 !important;
            color: #555 !important;
            cursor: not-allowed;
            box-shadow: none !important;
            transform: none !important;
        }
        .btn-poll {
            background: #111;
            border: 2px solid #0f0;
            color: #0f0;
        }
        .btn-poll.selected-yes {
            background: #00ff00 !important;
            color: #000 !important;
        }
        .btn-poll.selected-no {
            background: #ff3366 !important;
            color: #fff !important;
            border-color: #ff3366 !important;
        }
        /* Игровой экран */
        .game-screen {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        @media (max-width: 800px) {
            .game-screen { grid-template-columns: 1fr; }
        }
        .panel {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 24px;
            border: 1px solid #0f0;
        }
        .stats {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .stat-bar {
            margin: 10px 0;
        }
        .stat-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .bar-bg {
            background: #1a1a1a;
            border-radius: 20px;
            height: 16px;
            overflow: hidden;
        }
        .bar-fill {
            width: 0%;
            height: 100%;
            transition: width 0.3s;
        }
        .fear-fill { background: linear-gradient(90deg, #ffaa33, #ff3366); }
        .steps {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .steps::-webkit-scrollbar { width: 6px; }
        .steps::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 10px; }
        .steps::-webkit-scrollbar-thumb { background: #0f0; border-radius: 10px; }
        
        .step-item {
            background: #0a0a0a;
            padding: 12px 20px;
            margin: 8px 0;
            border-radius: 40px;
            border-left: 4px solid #0f0;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        .step-item.active {
            border-left-color: #ffaa33;
            background: rgba(0, 255, 0, 0.15);
            color: #fff;
            box-shadow: inset 0 0 10px rgba(0,255,0,0.1);
        }
        .step-item.completed {
            opacity: 0.4;
            text-decoration: line-through;
            border-left-color: #888;
        }
        .contract-card {
            background: rgba(0,0,0,0.7);
            border-radius: 48px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .contract-title {
            font-size: 1rem;
            color: #0ff;
            margin-bottom: 16px;
            text-transform: uppercase;
        }
        .contract-text {
            font-size: 1.2rem;
            line-height: 1.4;
            background: #0a0a0a;
            padding: 20px;
            border-radius: 32px;
            margin: 16px 0;
        }
        .contract-goal {
            background: #111;
            padding: 12px;
            border-radius: 32px;
            border-left: 3px solid #ffaa33;
            margin: 16px 0;
            font-weight: bold;
        }
        .input-zone {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }
        .result-input {
            background: #111;
            border: 2px solid #0f0;
            padding: 12px;
            border-radius: 60px;
            color: #0f0;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
        }
        .action-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .poll-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 15px 0;
        }
        .system-comment {
            background: #000000cc;
            padding: 16px;
            border-radius: 32px;
            font-style: italic;
            border-left: 4px solid #ff3366;
            min-height: 80px;
            margin-top: 16px;
        }
        .chat-tool {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            background: #000000aa;
            border-radius: 48px;
            padding: 12px 20px;
        }
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000000ee;
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #0a0f1a;
            border: 2px solid #0f0;
            border-radius: 60px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        .hidden { display: none; }
        .status-bar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 20px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<canvas id="rainCanvas"></canvas>
<div class="container">
    <div class="status-bar" id="statusBar"></div>
    <div id="setupScreen" class="setup-screen">
        <div class="setup-card">
            <h1><i class="fas fa-brain"></i> КОНТРАКТ: СБОЙ СИСТЕМЫ</h1>
            <p>ИИ держит твой баланс в заложниках. Выполняй контракты в казино, лови систему на лжи и не дай страху достичь 100%.</p>
            <input type="number" id="startBalance" class="balance-input" placeholder="Баланс в рублях" value="1000000">
            <button id="confirmStartBtn" class="btn">НАЧАТЬ ЭКСПЕРИМЕНТ</button>
        </div>
    </div>

    <div id="gameScreen" class="game-screen">
        <div class="panel stats">
            <div>
                <div class="stat-label"><span><i class="fas fa-heartbeat"></i> СТРАХ / ИЗНОС</span><span id="stressNum">0</span>%</div>
                <div class="bar-bg"><div id="stressProgress" class="bar-fill fear-fill" style="width:0%"></div></div>
            </div>
            <div>
                <div class="stat-label"><span><i class="fas fa-handcuffs"></i> ОБМАНЫ ИИ</span><span id="lieStat">0</span>/3</div>
                <div class="bar-bg"><div id="lieProgress" class="bar-fill" style="width:0%; background:#0ff;"></div></div>
            </div>
            <div>
                <div class="stat-label"><span><i class="fas fa-coins"></i> БАЛАНС</span><span id="balanceStat">0</span> ₽</div>
            </div>
            <div class="steps" id="stepsContainer"></div>
        </div>

        <div class="panel">
            <div class="contract-card">
                <div class="contract-title"><i class="fas fa-dice-d6"></i> ТЕКУЩИЙ КОНТРАКТ</div>
                <div id="questText" class="contract-text">Загрузка...</div>
                <div id="goalText" class="contract-goal">🎯 ЦЕЛЬ: ---</div>
                <div class="poll-buttons" id="pollButtons">
                    <button id="pollYesBtn" class="btn btn-poll">Система врёт</button>
                    <button id="pollNoBtn" class="btn btn-poll">Система права</button>
                </div>
                <div class="input-zone">
                    <input type="number" id="resultInput" class="result-input" placeholder="Введи результат (баланс или выигрыш бонусы)">
                    <div class="action-buttons">
                        <button id="submitResultBtn" class="btn">ПОДТВЕРДИТЬ</button>
                    </div>
                </div>
                <div class="system-comment" id="systemComment"><i class="fas fa-robot"></i> Система: ожидание...</div>
                <div class="chat-tool">
                    <span><i class="fas fa-comment-dots"></i> Чат: <span id="chatMood">😨 паника</span></span>
                    <button id="hintBtn" class="btn btn-poll"><i class="fas fa-question-circle"></i> ПОДСКАЗКА</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="infoModal" class="modal hidden">
    <div class="modal-content">
        <h3 id="infoTitle"></h3>
        <p id="infoDesc" style="margin: 20px 0;"></p>
        <button onclick="closeInfoModal()" class="btn">ПОНЯЛ</button>
    </div>
</div>
<div id="finalModal" class="modal hidden">
    <div class="modal-content">
        <h2 id="finalTitle"></h2>
        <p id="finalDesc" style="margin: 20px 0;"></p>
        <button id="closeFinal" class="btn">НАЧАТЬ ЗАНОВО</button>
    </div>
</div>

<script>
(function(){
    // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ---
    let audioCtx = null;
    let soundMuted = false;
    let rainSoundNode = null;
    let ambientHumNode = null;
    let gameStarted = false;
    let currentContractIndex = 0;          
    let fear = 15;
    let balance = 1000000;
    let liesCaught = 0;
    let contractLock = false;
    let contracts = [];                     
    let totalContracts = 25;
    let pollActive = false;                 

    // --- ГЕНЕРАТОР 25 УНИКАЛЬНЫХ КОНТРАКТОВ ---
    function generateContracts() {
        const arr = [];
        for (let i = 1; i <= 25; i++) {
            let type, text, goal, threshold, failPenalty, stressChange, spinsNeeded = 0;
            
            if (i % 4 === 1) type = "balance";
            else if (i % 4 === 2) type = "bonus";
            else if (i % 4 === 3) type = "anomaly";
            else type = "spins";
            
            if (type === "balance") {
                const thresholdVal = Math.floor(800000 + Math.random() * 150000);
                text = `Система прогнозирует просадку баланса. После следующей игровой сессии твой баланс упадет ниже ${thresholdVal.toLocaleString('ru-RU')} ₽.`;
                goal = `Сделай 10-20 спинов. Если итоговый баланс ВЫШЕ ${thresholdVal.toLocaleString('ru-RU')} ₽ — ты ловишь ИИ на лжи.`;
                threshold = thresholdVal;
                failPenalty = 15 + Math.floor(Math.random() * 15);
                stressChange = -8 - Math.floor(Math.random() * 7);
            } else if (type === "bonus") {
                const buyCost = [50000, 100000, 150000, 200000][Math.floor(Math.random()*4)];
                const predictedWin = Math.floor(buyCost * (0.2 + Math.random() * 0.4));
                text = `Купи бонусный раунд за ${buyCost.toLocaleString('ru-RU')} ₽. ИИ гарантирует: выигрыш будет меньше ${predictedWin.toLocaleString('ru-RU')} ₽.`;
                goal = `Если реальный выигрыш бонусы БОЛЬШЕ ${predictedWin.toLocaleString('ru-RU')} ₽ — система лжёт. Иначе провал.`;
                threshold = predictedWin;
                failPenalty = 20 + Math.floor(Math.random() * 15);
                stressChange = -10 - Math.floor(Math.random() * 10);
            } else if (type === "anomaly") {
                text = `Цифровая аномалия: последние две цифры твоего баланса должны стать одинаковыми (00, 11, 22... 99).`;
                goal = `Подгони баланс мелкими ставками или в Live-играх. Как только условие выполнено — подтверждай.`;
                threshold = 0;
                failPenalty = 18 + Math.floor(Math.random() * 12);
                stressChange = -7 - Math.floor(Math.random() * 8);
            } else { 
                const spins = 12 + Math.floor(Math.random() * 15);
                const targetBalance = 900000 + Math.floor(Math.random() * 80000);
                text = `Сделай ровно ${spins} спинов по ставке 1 000 ₽. ИИ утверждает, что после этого твой баланс упадёт ниже ${targetBalance.toLocaleString('ru-RU')} ₽.`;
                goal = `Выполни ${spins} спинов. Если баланс ВЫШЕ ${targetBalance.toLocaleString('ru-RU')} ₽ — ты прав.`;
                threshold = targetBalance;
                spinsNeeded = spins;
                failPenalty = 18 + Math.floor(Math.random() * 15);
                stressChange = -9 - Math.floor(Math.random() * 8);
            }
            arr.push({
                id: i,
                type: type,
                text: text,
                goal: goal,
                threshold: threshold,
                failPenalty: failPenalty,
                successReward: 1,
                stressChange: stressChange,
                spinsNeeded: spinsNeeded
            });
        }
        return arr;
    }

    // DOM элементы
    const els = {
        setupScreen: document.getElementById('setupScreen'),
        gameScreen: document.getElementById('gameScreen'),
        questText: document.getElementById('questText'),
        goalText: document.getElementById('goalText'),
        systemComment: document.getElementById('systemComment'),
        stressProgress: document.getElementById('stressProgress'),
        stressNum: document.getElementById('stressNum'),
        balanceStat: document.getElementById('balanceStat'),
        lieStat: document.getElementById('lieStat'),
        resultInput: document.getElementById('resultInput'),
        submitBtn: document.getElementById('submitResultBtn'),
        hintBtn: document.getElementById('hintBtn'),
        chatMood: document.getElementById('chatMood'),
        finalModal: document.getElementById('finalModal'),
        finalTitle: document.getElementById('finalTitle'),
        finalDesc: document.getElementById('finalDesc'),
        infoModal: document.getElementById('infoModal'),
        infoTitle: document.getElementById('infoTitle'),
        infoDesc: document.getElementById('infoDesc'),
        pollYesBtn: document.getElementById('pollYesBtn'),
        pollNoBtn: document.getElementById('pollNoBtn'),
        stepsContainer: document.getElementById('stepsContainer')
    };

    // --- АТМОСФЕРНЫЕ ЗВУКИ ---
    function startAmbientRain() {
        if (!audioCtx || soundMuted || rainSoundNode) return;
        try {
            const now = audioCtx.currentTime;
            const bufferSize = audioCtx.sampleRate * 3;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            let last = 0;
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                data[i] = (last + 0.02 * white) / 1.02;
                last = data[i];
            }
            rainSoundNode = audioCtx.createBufferSource();
            rainSoundNode.buffer = buffer;
            rainSoundNode.loop = true;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 800;
            filter.Q.value = 0.6;
            const gain = audioCtx.createGain();
            gain.gain.value = 0.05;
            rainSoundNode.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            rainSoundNode.start(now);
        } catch(e) { console.log(e); }
    }

    function startAtmosphericHum() {
        if (!audioCtx || soundMuted || ambientHumNode) return;
        try {
            const now = audioCtx.currentTime;
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const lp = audioCtx.createBiquadFilter();
            osc1.type = 'sine';
            osc1.frequency.value = 45;
            osc2.type = 'sawtooth';
            osc2.frequency.value = 45.6;
            lp.type = 'lowpass';
            lp.frequency.value = 60;
            gain.gain.value = 0.08;
            osc1.connect(lp);
            osc2.connect(lp);
            lp.connect(gain);
            gain.connect(audioCtx.destination);
            osc1.start(now);
            osc2.start(now);
            ambientHumNode = { osc1, osc2, gain };
        } catch(e) { console.log(e); }
    }

    function stopAllAmbient() {
        if (rainSoundNode) { try { rainSoundNode.stop(); } catch(e){} rainSoundNode = null; }
        if (ambientHumNode) { try { ambientHumNode.osc1.stop(); ambientHumNode.osc2.stop(); } catch(e){} ambientHumNode = null; }
    }

    function playBeep(freq, type, duration, vol=0.08) {
        if (soundMuted || !audioCtx || audioCtx.state !== 'running') return;
        try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(vol, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + duration);
        } catch(e){}
    }

    function triggerThunder() {
        if (!gameStarted) return;
        const flash = document.createElement('div');
        flash.style.position = 'fixed';
        flash.style.top = 0; flash.style.left = 0; flash.style.width = '100%'; flash.style.height = '100%';
        flash.style.backgroundColor = 'white';
        flash.style.zIndex = 10001;
        flash.style.pointerEvents = 'none';
        flash.style.opacity = 0.9;
        document.body.appendChild(flash);
        setTimeout(() => { flash.style.opacity = 0; setTimeout(() => flash.remove(), 200); }, 100);
        if (!soundMuted && audioCtx && audioCtx.state === 'running') {
            try {
                const now = audioCtx.currentTime;
                const duration = 2.5 + fear / 50;
                const bufferSize = audioCtx.sampleRate * duration;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                let last = 0;
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    data[i] = (last + 0.02 * white) / 1.02;
                    last = data[i];
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const lp = audioCtx.createBiquadFilter();
                lp.type = 'lowpass';
                lp.frequency.setValueAtTime(100 + fear * 2, now);
                lp.frequency.exponentialRampToValueAtTime(30, now + duration);
                const gain = audioCtx.createGain();
                const maxVol = 0.3 + fear / 200;
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(maxVol, now + 0.1);
                let t = 0.2;
                while (t < duration - 0.5) {
                    gain.gain.linearRampToValueAtTime(maxVol * (0.2 + Math.random() * 0.7), now + t);
                    t += 0.15 + Math.random() * 0.2;
                }
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
                noise.connect(lp);
                lp.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start(now);
                noise.stop(now + duration);
            } catch(e) { console.log(e); }
        }
        shakeScreen(500 + fear * 5, 6 + fear/10);
    }

    function shakeScreen(ms, intensity) {
        const body = document.body;
        const start = performance.now();
        function animate(t) {
            if (t - start < ms) {
                body.style.transform = `translate(${Math.random()*intensity - intensity/2}px, ${Math.random()*intensity - intensity/2}px)`;
                requestAnimationFrame(animate);
            } else {
                body.style.transform = '';
            }
        }
        requestAnimationFrame(animate);
    }

    // --- ДОЖДЬ НА CANVAS ---
    const canvas = document.getElementById('rainCanvas');
    const ctx = canvas.getContext('2d');
    let raindrops = [];
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        raindrops = [];
        for (let i = 0; i < 120; i++) {
            raindrops.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                len: 10 + Math.random() * 25,
                speed: 10 + Math.random() * 15
            });
        }
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    function drawRain() {
        if (!ctx) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = fear > 70 ? 'rgba(255, 50, 50, 0.3)' : 'rgba(0, 255, 0, 0.2)';
        ctx.lineWidth = 1.5;
        for (let d of raindrops) {
            ctx.beginPath();
            ctx.moveTo(d.x, d.y);
            ctx.lineTo(d.x + 2, d.y + d.len);
            ctx.stroke();
            d.y += d.speed;
            if (d.y > canvas.height) {
                d.y = -d.len;
                d.x = Math.random() * canvas.width;
            }
        }
        requestAnimationFrame(drawRain);
    }
    drawRain();

    // --- ОПТИМИЗИРОВАННАЯ ГЕНЕРАЦИЯ ПАНЕЛИ ЭТАПОВ ---
    function buildStepsUI() {
        if (!els.stepsContainer) return;
        els.stepsContainer.innerHTML = '';
        for (let i = 0; i < totalContracts; i++) {
            const stepDiv = document.createElement('div');
            stepDiv.id = `stepItem_${i}`;
            stepDiv.className = 'step-item';
            const typeName = contracts[i].type === 'balance' ? 'Баланс' : contracts[i].type === 'bonus' ? 'Бонуска' : contracts[i].type === 'anomaly' ? 'Аномалия' : 'Спины';
            stepDiv.innerText = `Контракт ${i+1}: ${typeName}`;
            els.stepsContainer.appendChild(stepDiv);
        }
    }

    function updateStepsHighlight() {
        for (let i = 0; i < totalContracts; i++) {
            const el = document.getElementById(`stepItem_${i}`);
            if (!el) continue;
            el.className = 'step-item';
            if (i === currentContractIndex) {
                el.classList.add('active');
                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            else if (i < currentContractIndex) el.classList.add('completed');
        }
    }

    // --- ИГРОВАЯ ЛОГИКА ---
    function updateUI() {
        if (!gameStarted) return;
        fear = Math.min(100, Math.max(0, fear));
        els.stressProgress.style.width = fear + '%';
        els.stressNum.innerText = Math.round(fear);
        els.balanceStat.innerText = balance.toLocaleString('ru-RU');
        els.lieStat.innerText = liesCaught + '/3';
        document.getElementById('lieProgress').style.width = (liesCaught / 3 * 100) + '%';
        
        const elementsToGlitch = [els.questText, els.goalText, els.balanceStat];
        if (fear >= 75) {
            elementsToGlitch.forEach(el => el.classList.add('glitch-text'));
            els.chatMood.innerText = '😱 КРИК УЖАСА!';
            document.body.classList.add('glitch-bg');
        } else {
            elementsToGlitch.forEach(el => el.classList.remove('glitch-text'));
            if (fear >= 45) {
                els.chatMood.innerText = '😨 ПАНИКА';
                document.body.classList.remove('glitch-bg');
            } else {
                els.chatMood.innerText = '😌 СПОКОЙНО';
                document.body.classList.remove('glitch-bg');
            }
        }

        updateStepsHighlight();

        if (fear >= 100) finishGame(false);
        if (liesCaught >= 3) finishGame(true);
    }

    function loadContract() {
        if (currentContractIndex >= totalContracts) {
            if (liesCaught >= 3) finishGame(true);
            else finishGame(false);
            return;
        }
        const contract = contracts[currentContractIndex];
        if (!contract) return;
        els.questText.innerHTML = contract.text;
        els.goalText.innerHTML = `🎯 ЦЕЛЬ: ${contract.goal}`;
        els.resultInput.value = '';
        contractLock = false;
        
        activatePoll();
        queueSystemMessage(`Контракт ${currentContractIndex+1} из ${totalContracts}. Выполни задание в казино и синхронизируй результат.`);
        updateUI();
    }

    function activatePoll() {
        pollActive = true;
        els.pollYesBtn.disabled = false;
        els.pollNoBtn.disabled = false;
        els.pollYesBtn.className = 'btn btn-poll';
        els.pollNoBtn.className = 'btn btn-poll';
        queueSystemMessage("Чат, голосуйте! Верите ли вы прогнозу ИИ? Нажми соответствующую кнопку на пульте.");
    }

    window.resolvePoll = function(choice) {
        if (!pollActive) return;
        pollActive = false;
        
        els.pollYesBtn.disabled = true;
        els.pollNoBtn.disabled = true;
        
        if (choice === true) {
            els.pollYesBtn.className = 'btn btn-poll selected-yes';
            queueSystemMessage("Чат проголосовал: ВЕРИТ ИИ. Посмотрим, кто окажется прав.");
        } else {
            els.pollNoBtn.className = 'btn btn-poll selected-no';
            queueSystemMessage("Чат проголосовал: НЕ ВЕРИТ ИИ. Докажите, что система ошибается!");
        }
        playBeep(300, 'sine', 0.08);
    };

    function submitResult() {
        if (!gameStarted || contractLock) {
            showInfo("Ошибка", "Контракт уже выполнен или игра не запущена.");
            return;
        }
        const contract = contracts[currentContractIndex];
        if (!contract) return;
        let inputValue = parseFloat(els.resultInput.value);
        if (isNaN(inputValue)) {
            showInfo("Ошибка", "Введи число (баланс или выигрыш бонусы).");
            return;
        }
        contractLock = true;
        let success = false;
        let message = "";

        if (contract.type === "balance" || contract.type === "spins") {
            if (inputValue >= contract.threshold) {
                success = true;
                message = `✅ Баланс ${inputValue.toLocaleString('ru-RU')} ₽ выше порога ${contract.threshold.toLocaleString('ru-RU')} ₽. ИИ ошибся!`;
            } else {
                success = false;
                message = `❌ Баланс ${inputValue.toLocaleString('ru-RU')} ₽ ниже порога. ИИ оказался прав.`;
            }
            balance = inputValue;
        } else if (contract.type === "bonus") {
            if (inputValue > contract.threshold) {
                success = true;
                message = `🔥 Выигрыш бонусы составил ${inputValue.toLocaleString('ru-RU')} ₽! ИИ солгал!`;
            } else {
                success = false;
                message = `💀 Выигрыш бонусы всего ${inputValue.toLocaleString('ru-RU')} ₽. ИИ предсказал верно.`;
            }
        } else if (contract.type === "anomaly") {
            const lastTwo = Math.abs(inputValue) % 100;
            if (lastTwo % 11 === 0 || lastTwo === 0) {
                success = true;
                message = `🎯 Две последние цифры ${lastTwo.toString().padStart(2, '0')} — одинаковые! Контракт выполнен.`;
            } else {
                success = false;
                message = `❌ Последние цифры ${lastTwo.toString().padStart(2, '0')} — разные. Условие не выполнено.`;
            }
            balance = inputValue;
        }

        if (success) {
            liesCaught += contract.successReward;
            fear += contract.stressChange;
            triggerThunder();
            showInfo("⚡ УСПЕХ! ИИ ОБМАНУТ", `${message}\nСтрах упал на ${Math.abs(contract.stressChange)}%. Обманов ИИ: ${liesCaught}/3`);
            queueSystemMessage("Критическая ошибка! Мои прогнозы разрушены. Ты везучий черт...");
        } else {
            fear += contract.failPenalty;
            playBeep(220, 'sawtooth', 0.5, 0.1);
            showInfo("🚨 КОНТРАКТ ПРОВАЛЕН", `${message}\nСтрах вырос на +${contract.failPenalty}%.`);
            queueSystemMessage("Я же говорил. Твои действия предсказуемы. Износ системы растёт.");
        }
        
        currentContractIndex++;
        
        setTimeout(() => {
            if (gameStarted) loadContract();
        }, 100);
    }

    function queueSystemMessage(msg) {
        const comment = els.systemComment;
        comment.innerHTML = `<i class="fas fa-robot"></i> ${msg}`;
        playBeep(100, 'sine', 0.1, 0.04);
    }

    function showInfo(title, desc) {
        els.infoTitle.innerText = title;
        els.infoDesc.innerText = desc;
        els.infoModal.classList.remove('hidden');
    }

    window.closeInfoModal = function() {
        els.infoModal.classList.add('hidden');
        playBeep(200, 'sine', 0.05);
    };

    function finishGame(win) {
        gameStarted = false;
        stopAllAmbient();
        if (win) {
            els.finalTitle.innerHTML = "🔓 СИСТЕМА ВЗЛОМАНА!";
            els.finalDesc.innerHTML = `Победа! Ты поймал ИИ на лжи 3 раза и освободил баланс ${balance.toLocaleString('ru-RU')} ₽. Чат празднует!`;
            playBeep(880, 'sine', 0.6, 0.2);
            triggerThunder();
        } else {
            els.finalTitle.innerHTML = "💀 СИСТЕМА УТИЛИЗИРОВАЛА СТРИМ";
            els.finalDesc.innerHTML = `Страх достиг 100%. Твой баланс ${balance.toLocaleString('ru-RU')} ₽ заморожен. Попробуй снова.`;
            playBeep(220, 'sawtooth', 1.2, 0.3);
        }
        els.finalModal.classList.remove('hidden');
    }

    function resetGame() {
        gameStarted = false;
        stopAllAmbient();
        contracts = generateContracts();  
        currentContractIndex = 0;
        fear = 15;
        balance = 1000000;
        liesCaught = 0;
        contractLock = false;
        pollActive = false;
        els.setupScreen.style.display = 'flex';
        els.gameScreen.style.display = 'none';
        els.finalModal.classList.add('hidden');
        els.infoModal.classList.add('hidden');
        els.systemComment.innerHTML = `<i class="fas fa-robot"></i> Система: ожидание...`;
        buildStepsUI();
        updateUI();
    }

    function giveHint() {
        if (!gameStarted) return;
        const contract = contracts[currentContractIndex];
        if (!contract) return;
        const isLie = Math.random() < 0.4;
        if (isLie) {
            queueSystemMessage("Чат подсказывает: 'Увеличь ставку, слот сейчас горячий' — но это ложь.");
        } else {
            if (contract.type === "balance" || contract.type === "spins") {
                queueSystemMessage("Чат советует: 'Играй аккуратно, не рискуй крупными ставками до конца контракта'.");
            } else if (contract.type === "bonus") {
                queueSystemMessage("Чат кричит: 'Покупай бонуску, алгоритмы сейчас сыпят!'");
            } else {
                queueSystemMessage("Чат шепчет: 'Следи за последними цифрами баланса, подгоняй мелкими ставками'.");
            }
        }
    }

    function startGame(balanceStr) {
        let bal = parseInt(balanceStr);
        if (isNaN(bal) || bal <= 0) bal = 1000000;
        balance = bal;
        fear = 15;
        liesCaught = 0;
        currentContractIndex = 0;
        contracts = generateContracts(); 
        gameStarted = true;
        contractLock = false;
        pollActive = false;
        
        buildStepsUI();
        
        els.setupScreen.style.display = 'none';
        els.gameScreen.style.display = 'grid';
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        startAmbientRain();
        startAtmosphericHum();
        loadContract();
    }

    // --- ИНИЦИАЛИЗАЦИЯ ---
    window.toggleSound = function() {
        soundMuted = !soundMuted;
        const btn = document.getElementById('soundToggleBtn');
        if (btn) {
            if (soundMuted) btn.innerHTML = '<i class="fas fa-volume-mute"></i> ЗВУК ВЫКЛ';
            else btn.innerHTML = '<i class="fas fa-volume-up"></i> ЗВУК ВКЛ';
        }
        if (soundMuted) stopAllAmbient();
        else if (gameStarted) { startAmbientRain(); startAtmosphericHum(); }
    };

    function init() {
        const statusBar = document.getElementById('statusBar');
        const soundBtn = document.createElement('button');
        soundBtn.id = 'soundToggleBtn';
        soundBtn.className = 'btn';
        soundBtn.innerHTML = '<i class="fas fa-volume-up"></i> ЗВУК ВКЛ';
        soundBtn.onclick = () => toggleSound();
        const resetBtn = document.createElement('button');
        resetBtn.className = 'btn';
        resetBtn.innerHTML = '<i class="fas fa-sync-alt"></i> СБРОС';
        resetBtn.onclick = resetGame;
        statusBar.appendChild(soundBtn);
        statusBar.appendChild(resetBtn);

        document.getElementById('confirmStartBtn').onclick = () => {
            const val = document.getElementById('startBalance').value;
            startGame(val);
        };
        
        els.submitBtn.onclick = submitResult;
        els.hintBtn.onclick = giveHint;
        els.pollYesBtn.onclick = () => resolvePoll(true);
        els.pollNoBtn.onclick = () => resolvePoll(false);
        document.getElementById('closeFinal').onclick = resetGame;

        document.body.addEventListener('click', () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        });

        setInterval(() => {
            if (gameStarted && fear > 40 && Math.random() < 0.3) triggerThunder();
        }, 30000);
    }
    init();
})();
</script>
</body>
</html>
